name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx eslint
      - run: npx tsc --noEmit
      - run: node scripts/audit-gate.mjs
      - run: npm run build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db   # build-time placeholder, no connection is made
